<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement | Meus Resgates</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
    <div class="app-shell">
        <header class="dash-header">
            <span class="dash-header__brand">MOVEMENT</span>

            <div class="dash-header__user">
                <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="main-nav">
                    <span aria-hidden="true">☰</span> Menu
                </button>
                <span id="user-greeting" class="dash-header__greeting">Olá!</span>
                <button type="button" id="logout-btn" class="link-btn">Sair</button>
            </div>
        </header>

        <nav class="bottom-nav" id="main-nav" aria-label="Navegação principal">
            <a href="dashboard.html" class="bottom-nav__item">Início</a>
            <a href="historico.html" class="bottom-nav__item">Histórico</a>
            <a href="recompensas.html" class="bottom-nav__item">Recompensas</a>
            <a href="meus-resgates.html" class="bottom-nav__item is-active" aria-current="page">Meus Resgates</a>
            <span class="bottom-nav__item is-disabled" aria-disabled="true" title="Em breve">Perfil</span>
        </nav>

        <main class="dash-main">
            <section class="dash-section">
                <h1 id="resgates-title" class="dash-section__title" tabindex="-1">Meus Resgates</h1>
                <ul id="resgates-list" class="resgates-list" aria-live="polite">
                    <li class="dash-section__placeholder">Carregando...</li>
                </ul>
            </section>
        </main>
    </div>

    <!-- Modal: código do resgate (código + QR Code) -->
    <div id="modal-codigo-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-codigo-title">
            <h2 id="modal-codigo-title" class="modal__title">Código do resgate</h2>

            <div id="modal-codigo-qrcode" class="qrcode-container" aria-hidden="true"></div>

            <div class="receipt-row">
                <span class="receipt-row__label">Recompensa</span>
                <span id="modal-codigo-recompensa" class="receipt-row__value"></span>
            </div>
            <div class="receipt-row">
                <span class="receipt-row__label">Pontos</span>
                <span id="modal-codigo-pontos" class="receipt-row__value"></span>
            </div>
            <div id="modal-codigo-empresa-row" class="receipt-row" hidden>
                <span class="receipt-row__label">Empresa</span>
                <span id="modal-codigo-empresa" class="receipt-row__value"></span>
            </div>
            <div class="receipt-row">
                <span class="receipt-row__label">Código de reserva</span>
                <span id="modal-codigo-valor" class="modal__codigo"></span>
            </div>

            <p class="modal__note">
                Apresente este código no estabelecimento para utilizar sua recompensa.
            </p>

            <div class="modal__actions">
                <button type="button" id="modal-codigo-fechar" class="btn btn--primary">Fechar</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/meus-resgates.js"></script>
</body>
</html>
