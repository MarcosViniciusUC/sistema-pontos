<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement | Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
    <div class="app-shell">
        <header class="dash-header">
            <span class="dash-header__brand">MOVEMENT</span>

            <div class="dash-header__user">
                <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="main-nav">
                    <span aria-hidden="true">☰</span> Menu
                </button>
                <span id="user-greeting" class="dash-header__greeting">Olá!</span>
                <button type="button" id="logout-btn" class="link-btn">Sair</button>
            </div>
        </header>

        <nav class="bottom-nav" id="main-nav" aria-label="Navegação principal">
            <a href="dashboard.html" class="bottom-nav__item">
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11 12 4l8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="bottom-nav__label">Início</span>
            </a>
            <a href="historico.html" class="bottom-nav__item">
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="bottom-nav__label">Histórico</span>
            </a>
            <a href="recompensas.html" class="bottom-nav__item">
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="9" width="18" height="4" rx="1" stroke="currentColor" stroke-width="2"/><rect x="5" y="13" width="14" height="8" rx="1" stroke="currentColor" stroke-width="2"/><path d="M12 9v12M12 9c-1.8-3.2-6.8-2.4-6.8 0S10.2 12.2 12 9zm0 0c1.8-3.2 6.8-2.4 6.8 0S13.8 12.2 12 9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                <span class="bottom-nav__label">Recompensas</span>
            </a>
            <a href="meus-resgates.html" class="bottom-nav__item">
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8a2 2 0 0 1 0 4 2 2 0 0 1 0 4h16a2 2 0 0 1 0-4 2 2 0 0 1 0-4H4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="14" y1="8" x2="14" y2="16" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/></svg>
                <span class="bottom-nav__label">Meus Resgates</span>
            </a>
            <a href="perfil.html" class="bottom-nav__item is-active" aria-current="page">
                <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="bottom-nav__label">Perfil</span>
            </a>
        </nav>

        <main class="dash-main">
            <section class="rewards-intro">
                <div class="rewards-intro__text">
                    <h1 class="rewards-intro__title">Perfil</h1>
                    <p class="rewards-intro__subtitle">Seus dados, seu QR Code e o resumo da sua conta.</p>
                </div>
            </section>

            <section class="dash-section">
                <div class="profile-header" id="profile-header">
                    <p class="profile-header__nome" id="perfil-nome">Carregando…</p>
                    <p class="profile-header__contato" id="perfil-email"></p>
                    <p class="profile-header__contato" id="perfil-telefone" hidden></p>
                </div>
            </section>

            <!-- QR pessoal: mesmo qr_token e a mesma lógica qrcodejs já usadas
                 no fluxo de identificação (admin-clientes.js "Ver QR Code",
                 recompensas.js / meus-resgates.js para o código de resgate) —
                 só o tamanho é maior aqui (.qrcode-container--lg), pensado
                 para ser escaneado pelo funcionário/admin no balcão. -->
            <section class="dash-section">
                <div class="profile-card profile-card--center">
                    <h2 class="dash-section__title">Meu QR Code</h2>
                    <div id="perfil-qrcode" class="qrcode-container qrcode-container--lg" aria-hidden="true"></div>
                    <p class="profile-card__codigo" id="perfil-codigo">--</p>
                    <button type="button" id="copiar-codigo-btn" class="btn btn--ghost">Copiar código</button>
                </div>
            </section>

            <section class="dash-section">
                <div class="profile-card">
                    <h2 class="dash-section__title">Resumo da conta</h2>
                    <div class="profile-stats">
                        <div class="profile-stats__item">
                            <span class="profile-stats__label">Saldo atual</span>
                            <span class="profile-stats__value" id="resumo-saldo">--</span>
                        </div>
                        <div class="profile-stats__item">
                            <span class="profile-stats__label">Pontos recebidos</span>
                            <span class="profile-stats__value" id="resumo-recebidos">--</span>
                        </div>
                        <div class="profile-stats__item">
                            <span class="profile-stats__label">Pontos utilizados</span>
                            <span class="profile-stats__value profile-stats__value--saida" id="resumo-utilizados">--</span>
                        </div>
                        <div class="profile-stats__item">
                            <span class="profile-stats__label">Resgates realizados</span>
                            <span class="profile-stats__value" id="resumo-resgates">--</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="dash-section">
                <div class="dash-section__header">
                    <h2 class="dash-section__title">Atividade recente</h2>
                    <a href="historico.html" class="dash-section__link">Ver tudo</a>
                </div>
                <ul id="atividade-list" class="activity-list" aria-live="polite">
                    <li class="activity-item-skeleton skeleton" aria-hidden="true"></li>
                    <li class="activity-item-skeleton skeleton" aria-hidden="true"></li>
                    <li class="activity-item-skeleton skeleton" aria-hidden="true"></li>
                </ul>
            </section>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/perfil.js"></script>
</body>
</html>
