<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement | Clientes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <div class="admin-shell">
        <header class="dash-header">
            <span class="dash-header__brand">MOVEMENT ADMIN</span>

            <div class="dash-header__user">
                <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="main-nav">
                    <span aria-hidden="true">☰</span> Menu
                </button>
                <span id="user-greeting" class="dash-header__greeting">Olá!</span>
                <button type="button" id="logout-btn" class="link-btn">Sair</button>
            </div>
        </header>

        <div class="admin-body">
            <nav class="admin-nav" id="main-nav" aria-label="Navegação administrativa">
                <a href="admin.html" class="admin-nav__item">Dashboard</a>
                <a href="admin-clientes.html" class="admin-nav__item is-active" aria-current="page">Clientes</a>
                <a href="admin-recompensas.html" class="admin-nav__item">Recompensas</a>
                <a href="admin-empresas.html" class="admin-nav__item">Empresas</a>
                <a href="admin-resgates.html" class="admin-nav__item">Resgates</a>
                <a href="admin-validar.html" class="admin-nav__item">Validar</a>
                <a href="admin-identificar-cliente.html" class="admin-nav__item">Identificar</a>
            </nav>

            <main class="admin-main">
                <h1 class="admin-page-title">Clientes</h1>

                <div id="page-message" class="form-message" role="status" aria-live="polite" tabindex="-1" hidden></div>

                <div class="admin-toolbar">
                    <input
                        type="search"
                        id="busca-cliente"
                        class="search-input"
                        placeholder="Buscar por nome ou email..."
                        aria-label="Buscar cliente por nome ou email"
                    >
                </div>

                <div id="clientes-container" aria-live="polite">
                    <p class="dash-section__placeholder">Carregando...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: editar cliente -->
    <div id="modal-editar-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-editar-title">
            <h2 id="modal-editar-title" class="modal__title">Editar cliente</h2>

            <form id="form-editar" class="modal-form" novalidate>
                <div class="field">
                    <label for="editar-nome">Nome</label>
                    <input type="text" id="editar-nome" name="nome" required>
                </div>
                <div class="field">
                    <label for="editar-email">Email</label>
                    <input type="email" id="editar-email" name="email" required>
                </div>
                <div class="field">
                    <label for="editar-telefone">Telefone</label>
                    <input type="text" id="editar-telefone" name="telefone" placeholder="Opcional">
                </div>

                <p id="modal-editar-error" class="modal__error" hidden></p>

                <div class="modal__actions">
                    <button type="button" id="modal-editar-cancelar" class="btn btn--ghost">Cancelar</button>
                    <button type="submit" id="modal-editar-confirmar" class="btn btn--primary">
                        <span class="btn__spinner" aria-hidden="true"></span>
                        <span class="btn__label">Salvar alterações</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: QR Code individual do cliente -->
    <div id="modal-qr-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-qr-title">
            <h2 id="modal-qr-title" class="modal__title">QR Code do cliente</h2>
            <p id="modal-qr-nome" class="modal__reward-name"></p>

            <div id="modal-qr-qrcode" class="qrcode-container" aria-hidden="true"></div>

            <p class="modal__note">
                Este código identifica o cliente para o funcionário/admin. Ele não contém nome, email ou
                qualquer outro dado pessoal.
            </p>

            <div class="modal__actions">
                <button type="button" id="modal-qr-fechar" class="btn btn--primary">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal: adicionar/remover pontos -->
    <div id="modal-pontos-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-pontos-title">
            <h2 id="modal-pontos-title" class="modal__title">Adicionar pontos</h2>
            <p id="modal-pontos-cliente" class="modal__reward-name"></p>

            <form id="form-pontos" class="modal-form" novalidate>
                <!-- Empresa só se aplica a entrada de pontos — escondida
                     quando o modal está no modo "remover pontos". -->
                <div id="pontos-empresa-campo" class="field">
                    <label for="pontos-empresa">Empresa</label>
                    <select id="pontos-empresa" name="empresa_id" required>
                        <option value="" disabled selected>Selecione a empresa</option>
                    </select>
                </div>
                <div class="field">
                    <label for="pontos-quantidade">Quantidade</label>
                    <input type="number" id="pontos-quantidade" name="quantidade" min="1" step="1" inputmode="numeric" required>
                </div>
                <div class="field">
                    <label for="pontos-descricao">Descrição</label>
                    <input type="text" id="pontos-descricao" name="descricao" placeholder="Ex: Serviço realizado">
                </div>

                <p id="modal-pontos-error" class="modal__error" hidden></p>

                <div class="modal__actions">
                    <button type="button" id="modal-pontos-cancelar" class="btn btn--ghost">Cancelar</button>
                    <button type="submit" id="modal-pontos-confirmar" class="btn btn--primary">
                        <span class="btn__spinner" aria-hidden="true"></span>
                        <span class="btn__label">Confirmar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/admin-clientes.js"></script>
</body>
</html>
