<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement | Validar resgate (admin)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <div class="admin-shell admin-validar-page">
        <header class="dash-header">
            <span class="dash-header__brand">MOVEMENT ADMIN</span>

            <div class="dash-header__user">
                <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="main-nav">
                    <span aria-hidden="true">☰</span> Menu
                </button>
                <span id="user-greeting" class="dash-header__greeting">Olá!</span>
                <button type="button" id="logout-btn" class="link-btn">Sair</button>
            </div>
        </header>

        <div class="admin-body">
            <nav class="admin-nav" id="main-nav" aria-label="Navegação administrativa">
                <span class="admin-nav__group-label">Visão geral</span>
                <a href="admin.html" class="admin-nav__item">
                    <svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="5" y1="19" x2="5" y2="11" stroke="currentColor" stroke-width="2.5"/><line x1="12" y1="19" x2="12" y2="6" stroke="currentColor" stroke-width="2.5"/><line x1="19" y1="19" x2="19" y2="14" stroke="currentColor" stroke-width="2.5"/></svg>
                    <span class="admin-nav__label">Dashboard</span>
                </a>

                <span class="admin-nav__group-label">Gestão</span>
                <a href="admin-clientes.html" class="admin-nav__item">
                    <svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <span class="admin-nav__label">Clientes</span>
                </a>
                <a href="admin-recompensas.html" class="admin-nav__item">
                    <svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="9" width="18" height="4" rx="1" stroke="currentColor" stroke-width="2"/><rect x="5" y="13" width="14" height="8" rx="1" stroke="currentColor" stroke-width="2"/><path d="M12 9v12M12 9c-1.8-3.2-6.8-2.4-6.8 0S10.2 12.2 12 9zm0 0c1.8-3.2 6.8-2.4 6.8 0S13.8 12.2 12 9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                    <span class="admin-nav__label">Recompensas</span>
                </a>
                <a href="admin-empresas.html" class="admin-nav__item">
                    <svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="4" width="14" height="17" stroke="currentColor" stroke-width="2"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <span class="admin-nav__label">Empresas</span>
                </a>

                <span class="admin-nav__group-label">Operações</span>
                <a href="admin-resgates.html" class="admin-nav__item">
                    <svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8a2 2 0 0 1 0 4 2 2 0 0 1 0 4h16a2 2 0 0 1 0-4 2 2 0 0 1 0-4H4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="14" y1="8" x2="14" y2="16" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/></svg>
                    <span class="admin-nav__label">Resgates</span>
                </a>
                <a href="admin-validar.html" class="admin-nav__item is-active" aria-current="page">
                    <svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l7 3v6c0 5-3.1 7.6-7 9-3.9-1.4-7-4-7-9V6l7-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                    <span class="admin-nav__label">Validar</span>
                </a>
                <a href="admin-identificar-cliente.html" class="admin-nav__item">
                    <svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="3" height="3" fill="currentColor"/><rect x="18" y="18" width="3" height="3" fill="currentColor"/></svg>
                    <span class="admin-nav__label">Identificar</span>
                </a>
            </nav>

            <main class="admin-main">
                <h1 class="admin-page-title">Validar resgate</h1>

                <!-- Campo único de código: pode ser digitado manualmente ou
                     preenchido pelo scanner de QR Code abaixo — as duas vias
                     enviam para o mesmo POST /resgates/validar. -->
                <form id="form-validar" class="modal-form admin-form--narrow" novalidate>
                    <div class="field">
                        <label for="codigo-input">Código do resgate</label>
                        <input
                            type="text"
                            id="codigo-input"
                            name="codigo"
                            placeholder="Ex: EQ32KY67"
                            autocapitalize="characters"
                            autocomplete="off"
                            spellcheck="false"
                            required
                        >
                    </div>

                    <button type="button" id="abrir-scanner-btn" class="btn btn--ghost btn--block">
                        Ler QR Code
                    </button>

                    <div
                        id="resultado-mensagem"
                        class="form-message"
                        role="status"
                        aria-live="polite"
                        tabindex="-1"
                        hidden
                    ></div>

                    <button type="submit" class="btn btn--primary btn--block" id="validar-btn">
                        <span class="btn__spinner" aria-hidden="true"></span>
                        <span class="btn__label">Validar resgate</span>
                    </button>
                </form>

                <div id="resultado-detalhes" class="admin-result-card" hidden>
                    <h2 class="admin-result-card__title">Resgate validado</h2>

                    <div class="receipt-row">
                        <span class="receipt-row__label">Recompensa</span>
                        <span class="receipt-row__value" id="resultado-recompensa"></span>
                    </div>

                    <div class="receipt-row">
                        <span class="receipt-row__label">Pontos</span>
                        <span class="receipt-row__value" id="resultado-pontos"></span>
                    </div>

                    <div class="receipt-row">
                        <span class="receipt-row__label">Código</span>
                        <span class="modal__codigo" id="resultado-codigo"></span>
                    </div>

                    <div class="receipt-row">
                        <span class="receipt-row__label">Status</span>
                        <span class="status-badge status-badge--aprovado">Utilizado</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: leitura de QR Code pela câmera. O código lido só preenche o
         campo já existente e aciona a mesma validação do formulário manual
         (ver executarValidacao em admin-validar.js) — não existe uma
         segunda lógica de validação para o QR. -->
    <div id="modal-scanner-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-scanner-title">
            <h2 id="modal-scanner-title" class="modal__title">Ler QR Code</h2>

            <div class="scanner-preview">
                <video id="scanner-video" playsinline muted></video>
            </div>
            <canvas id="scanner-canvas" hidden></canvas>

            <p class="modal__note">Aponte a câmera para o QR Code do resgate.</p>

            <div class="modal__actions">
                <button type="button" id="scanner-fechar" class="btn btn--ghost">Fechar câmera</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/admin-validar.js"></script>
</body>
</html>
