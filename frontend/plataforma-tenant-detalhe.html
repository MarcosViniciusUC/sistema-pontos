<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple Tech | Detalhes do tenant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <div class="admin-shell">
        <header class="dash-header">
            <span class="dash-header__brand">MAPLE TECH</span>

            <div class="dash-header__user">
                <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="main-nav">
                    <span aria-hidden="true">☰</span> Menu
                </button>
                <span id="user-greeting" class="dash-header__greeting">Plataforma</span>
                <button type="button" id="logout-btn" class="link-btn">Sair</button>
            </div>
        </header>

        <div class="admin-body">
            <nav class="admin-nav" id="main-nav" aria-label="Navegação da plataforma">
                <a href="plataforma-dashboard.html" class="admin-nav__item">
                    <svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="5" y1="19" x2="5" y2="11" stroke="currentColor" stroke-width="2.5"/><line x1="12" y1="19" x2="12" y2="6" stroke="currentColor" stroke-width="2.5"/><line x1="19" y1="19" x2="19" y2="14" stroke="currentColor" stroke-width="2.5"/></svg>
                    <span class="admin-nav__label">Dashboard</span>
                </a>
                <a href="plataforma-tenants.html" class="admin-nav__item is-active" aria-current="page">
                    <svg class="admin-nav__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" stroke="currentColor" stroke-width="2"/></svg>
                    <span class="admin-nav__label">Tenants</span>
                </a>
            </nav>

            <main class="admin-main">
                <p class="dash-section__link"><a href="plataforma-tenants.html">&larr; Voltar para Tenants</a></p>
                <h1 class="admin-page-title" id="tenant-titulo">Detalhes do tenant</h1>

                <div id="page-message" class="form-message" role="status" aria-live="polite" tabindex="-1" hidden></div>

                <div id="tenant-detalhe-container" aria-live="polite">
                    <p class="dash-section__placeholder">Carregando...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: confirmar ativação/desativação -->
    <div id="modal-status-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-status-title">
            <h2 id="modal-status-title" class="modal__title">Alterar status</h2>
            <p id="modal-status-nome" class="modal__reward-name"></p>
            <p id="modal-status-nota" class="modal__note"></p>

            <p id="modal-status-error" class="modal__error" hidden></p>

            <div class="modal__actions">
                <button type="button" id="modal-status-cancelar" class="btn btn--ghost">Cancelar</button>
                <button type="button" id="modal-status-confirmar" class="btn btn--primary">
                    <span class="btn__spinner" aria-hidden="true"></span>
                    <span class="btn__label">Confirmar</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: criar administrador inicial -->
    <div id="modal-admin-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-admin-title">
            <h2 id="modal-admin-title" class="modal__title">Criar administrador</h2>

            <form id="form-admin" class="modal-form" novalidate>
                <div class="field">
                    <label for="admin-nome">Nome</label>
                    <input type="text" id="admin-nome" name="nome" placeholder="Nome completo" required>
                </div>
                <div class="field">
                    <label for="admin-email">Email</label>
                    <input type="email" id="admin-email" name="email" placeholder="email@tenant.com" required>
                </div>
                <div class="field">
                    <label for="admin-cpf">CPF</label>
                    <input type="text" id="admin-cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="field">
                    <label for="admin-telefone">Telefone (opcional)</label>
                    <input type="text" id="admin-telefone" name="telefone" placeholder="(00) 00000-0000">
                </div>
                <div class="field">
                    <label for="admin-senha">Senha</label>
                    <input type="password" id="admin-senha" name="senha" placeholder="Mínimo 6 caracteres" required>
                </div>

                <p id="modal-admin-error" class="modal__error" hidden></p>

                <div class="modal__actions">
                    <button type="button" id="modal-admin-cancelar" class="btn btn--ghost">Cancelar</button>
                    <button type="submit" id="modal-admin-confirmar" class="btn btn--primary">
                        <span class="btn__spinner" aria-hidden="true"></span>
                        <span class="btn__label">Criar administrador</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/plataforma-api.js"></script>
    <script src="assets/js/plataforma-auth.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/plataforma-tenant-detalhe.js"></script>
</body>
</html>
