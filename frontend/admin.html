<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement | Painel administrativo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <div class="admin-shell">
        <header class="dash-header">
            <span class="dash-header__brand">MOVEMENT ADMIN</span>

            <div class="dash-header__user">
                <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="main-nav">
                    <span aria-hidden="true">☰</span> Menu
                </button>
                <span id="user-greeting" class="dash-header__greeting">Olá!</span>
                <button type="button" id="logout-btn" class="link-btn">Sair</button>
            </div>
        </header>

        <div class="admin-body">
            <nav class="admin-nav" id="main-nav" aria-label="Navegação administrativa">
                <a href="admin.html" class="admin-nav__item is-active" aria-current="page">Dashboard</a>
                <a href="admin-clientes.html" class="admin-nav__item">Clientes</a>
                <a href="admin-recompensas.html" class="admin-nav__item">Recompensas</a>
                <a href="admin-empresas.html" class="admin-nav__item">Empresas</a>
                <a href="admin-resgates.html" class="admin-nav__item">Resgates</a>
                <a href="admin-validar.html" class="admin-nav__item">Validar</a>
                <a href="admin-identificar-cliente.html" class="admin-nav__item">Identificar</a>
            </nav>

            <main class="admin-main">
                <h1 class="admin-page-title">Dashboard</h1>

                <div id="kpi-grid" class="kpi-grid" aria-live="polite">
                    <p class="dash-section__placeholder">Carregando...</p>
                </div>

                <section class="dash-section">
                    <h2 class="dash-section__title">Pontos concedidos por empresa</h2>
                    <div class="origem-panel">
                        <div id="pontos-empresa-lista" class="origem-list" aria-live="polite">
                            <p class="dash-section__placeholder">Carregando...</p>
                        </div>
                    </div>
                </section>

                <section class="dash-section">
                    <h2 class="dash-section__title">Resumo dos resgates</h2>
                    <div class="operacao-panel">
                        <div id="resgates-status-lista" class="origem-list" aria-live="polite">
                            <p class="dash-section__placeholder">Carregando...</p>
                        </div>
                    </div>
                </section>

                <section class="dash-section">
                    <h2 class="dash-section__title">Clientes com mais pontos</h2>
                    <div id="ranking-container" aria-live="polite">
                        <p class="dash-section__placeholder">Carregando...</p>
                    </div>
                </section>

                <section class="dash-section">
                    <h2 class="dash-section__title">Últimos resgates</h2>
                    <div id="ultimos-resgates-container" aria-live="polite">
                        <p class="dash-section__placeholder">Carregando...</p>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/admin.js"></script>
</body>
</html>
